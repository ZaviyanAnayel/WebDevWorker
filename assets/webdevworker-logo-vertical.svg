<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="goldGradV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="35%" stop-color="#EAB308"/>
      <stop offset="75%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>
    <linearGradient id="silverGradV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="goldGlowV" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Center Top 3D Ribbon 'W' -->
  <g transform="translate(180, 20) scale(0.65)">
    <path d="M 60 40 L 140 40 L 190 180 L 110 180 Z" fill="url(#silverGradV)"/>
    <path d="M 110 180 L 190 180 L 140 290 Z" fill="#64748B" opacity="0.6"/>
    <path d="M 140 290 L 260 50 L 330 150 L 210 330 Z" fill="url(#goldGradV)" filter="url(#goldGlowV)"/>
    <path d="M 210 330 L 330 150 L 440 40 L 360 330 Z" fill="url(#goldGradV)"/>
    <path d="M 330 150 L 360 330 L 310 330 Z" fill="#78350F" opacity="0.4"/>
  </g>

  <!-- Typography Below -->
  <g transform="translate(50, 310)" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif">
    <text x="0" y="0" font-size="52" font-weight="900" fill="#FFFFFF" letter-spacing="-1.5">webdev</text>
    <text x="205" y="0" font-size="52" font-weight="900" fill="url(#goldGradV)" letter-spacing="-1.5">worker</text>
    <text x="390" y="0" font-size="34" font-weight="700" fill="#EAB308" letter-spacing="-0.5">.com</text>
  </g>
</svg>