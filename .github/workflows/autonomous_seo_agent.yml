name: Autonomous SEO Agent v2 (competitor-aware)

# 24/7 SEO engine: monitors competitors, finds keyword gaps, publishes
# template-locked guide articles, validates links/schema, updates sitemap,
# pings search engines. Replaces the v1 daily agent (same single schedule).
on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC (single schedule)
  workflow_dispatch:
    inputs:
      max_articles:
        description: "Max articles to publish this run"
        required: false
        default: "2"

permissions:
  contents: write

jobs:
  seo-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Competitor sitemap watch + keyword gap detection
        run: |
          python3 .github/scripts/competitor_watch.py \
            --out seo/gap_report.json \
            --ledger seo/keywords.json

      - name: Generate gap-targeted articles (template-locked)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MAX_ARTICLES: ${{ inputs.max_articles || '2' }}
        run: |
          python3 .github/scripts/generate_articles.py \
            --gaps seo/gap_report.json \
            --ledger seo/keywords.json \
            --max "$MAX_ARTICLES"

      - name: Validate new articles (links, schema, depth)
        run: |
          python3 .github/scripts/validate_articles.py --strict

      - name: Update sitemap + ping search engines
        run: |
          python3 .github/scripts/update_sitemap.py
          python3 .github/scripts/submit_indexnow.py || true
          curl -s "https://www.bing.com/ping?sitemap=https://www.webdevworker.com/sitemap.xml" > /dev/null || true

      - name: Commit & push
        run: |
          git config user.name "seo-agent[bot]"
          git config user.email "seo-agent[bot]@users.noreply.github.com"
          git add articles/ sitemap.xml seo/
          git diff --cached --quiet && echo "nothing to commit" || git commit -m "seo(agent): publish $(date -u +%F) gap-targeted guides"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
